plugins {
    id 'net.minecraftforge.gradle' version '6.0.+'
}

version = '1.0.0'
group = 'com.cubicengine.cubic_xxxxxxxxxxxxxxxxxxxxxxxx'
archivesBaseName = 'cubic_xxxxxxxxxxxxxxxxxxxxxxxx'

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

// 日本語など非ASCIIをソースから正しく読む（Windows既定のMS932でjavacが読むと文字化けする）
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

minecraft {
    mappings channel: 'official', version: '1.20.1'
    runs {
        client { workingDirectory project.file('run') }
        server { workingDirectory project.file('run') }
    }
}

repositories {
    maven {
        name = "GeckoLib"
        url = "https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/"
    }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.3.0'
    implementation fg.deobf("software.bernie.geckolib:geckolib-forge-1.20.1:4.8.4")
}