name: Build Engine (NeoForge 26.1)

# Java 版エンジン（generic_engine_26/）を CI で組む。
#
# ■ なぜ CI で組むか
#   AGENTS.md の決まり「配布物は、必ず CI で作る」。手元で組んだ jar は配らない。
#   加えて 26.1 は Java 25 が要り、手元に無い環境が多い。
#
# ■ 出来た jar の扱い
#   Artifacts に base-mod-neo26.jar が上がる。
#   public/ に置くのも CI にやらせる：Actions から手動実行して「commit_jar」を true にすると、
#   組んだ jar を public/base-mod-neo26.jar としてそのブランチにコミットする
#   （手元に落として置き直す経路を作らないため。作業環境からは Artifacts も落とせない）。
#   base-mod.jar / base-mod-neo.jar には触らない（1.20.1 / 1.21.1 の人が遊べなくなる）。
on:
  push:
    branches: [main]
    paths:
      - 'generic_engine_26/**'
      - '.github/workflows/engine-neo26.yml'
  pull_request:
    paths:
      - 'generic_engine_26/**'
      - '.github/workflows/engine-neo26.yml'
  workflow_dispatch:
    inputs:
      commit_jar:
        description: '組んだ jar を public/base-mod-neo26.jar としてこのブランチにコミットする'
        type: boolean
        default: false

# commit_jar のときだけ push する。それ以外は読むだけ
permissions:
  contents: write

jobs:
  build-engine:
    name: Build NeoForge 26.1 engine jar
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          # NeoForge 26.1 は Java 25 で組まれている。21 では NeoForge 本体のクラスが読めない
          java-version: '25'

      - name: GeckoLib の配布版を確かめる
        # 依存が見つからずに落ちたとき、ログだけで「どの名前・どの版が実在するか」が分かるようにする。
        # 作業用の環境からは cloudsmith に出られない（403）ので、ここで一覧を出しておく。
        run: |
          for a in geckolib-neoforge-26.1 geckolib-neoforge-26.1.2; do
            echo "### $a"
            curl -sS "https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/com/geckolib/$a/maven-metadata.xml" | head -40 || true
          done

      - name: Build
        working-directory: generic_engine_26
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon --stacktrace --warning-mode all

      - name: マイクラ本体の API 名を出す（コンパイルが落ちたときの手がかり）
        # 作業用の環境からは Mojang の mappings も maven も取れない（403）。
        # 「そのメソッドは無い」と言われたとき、代わりの名前をここで探せるようにする。
        if: failure()
        run: |
          # neoforge-*-universal.jar には本体のクラスが入っていない。ModDevGradle が作る
          # 「本体＋NeoForge を合わせた jar」を、Entity.class が入っているかで探す
          JAR=""
          for j in $(find "$HOME/.gradle" generic_engine_26/build -name '*.jar' 2>/dev/null | grep -vE 'sources|javadoc'); do
            if unzip -l "$j" 2>/dev/null | grep -q 'net/minecraft/world/entity/Entity.class'; then JAR="$j"; break; fi
          done
          echo "jar: $JAR"
          [ -z "$JAR" ] && exit 0
          for c in net.minecraft.world.entity.Entity net.minecraft.server.level.ServerPlayer net.minecraft.world.level.Level net.minecraft.world.entity.player.Player; do
            echo "### $c"
            javap -cp "$JAR" -public "$c" | grep -iE 'tag|scoreboard|server\(|clock|daytime|permission' || true
          done

      - name: modId が焼かれているか
        # 「起動するのに何も動かない」事故の予防。lib/javaEngine/spec.ts の ENGINE_MOD_ID と
        # jar の中の文字列が一致しなければ落とす（scripts/check-engine-modid.js と同じ考え方）
        run: |
          set -e
          JAR=$(ls generic_engine_26/build/libs/*.jar | grep -v -- '-sources' | head -1)
          echo "jar: $JAR"
          MODID=$(grep -o 'ENGINE_MOD_ID *= *"[^"]*"' lib/javaEngine/spec.ts | sed 's/.*"\(.*\)"/\1/')
          echo "spec.ts の ENGINE_MOD_ID: $MODID"
          mkdir -p /tmp/jarcheck && cd /tmp/jarcheck && unzip -oq "$GITHUB_WORKSPACE/$JAR"
          if ! grep -rqa "$MODID" --include='*.class' .; then
            echo "::error::jar の .class に $MODID が入っていない"; exit 1
          fi
          cp "$GITHUB_WORKSPACE/$JAR" /tmp/base-mod-neo26.jar

      - name: Upload engine jar
        uses: actions/upload-artifact@v4
        with:
          name: base-mod-neo26
          path: /tmp/base-mod-neo26.jar

      - name: public/ に置いてコミット（手動実行で commit_jar のときだけ）
        if: github.event_name == 'workflow_dispatch' && inputs.commit_jar
        run: |
          set -e
          cp /tmp/base-mod-neo26.jar public/base-mod-neo26.jar
          # 置いた直後に、同梱 jar 全部の modId 検査を通す（scripts/check-engine-modid.js）
          node scripts/check-engine-modid.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/base-mod-neo26.jar
          if git diff --cached --quiet; then echo "jar に変化なし"; exit 0; fi
          git commit -m "26.1 エンジンの jar を public/ に置く（CI ビルド ${GITHUB_SHA::7}）" \
                     -m "engine-neo26.yml の手動実行（commit_jar）が組んで置いた。手元ビルドではない。"
          git push origin "HEAD:${GITHUB_REF_NAME}"
