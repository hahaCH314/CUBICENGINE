name: Build Engine (NeoForge 26.1)

# Java 版エンジン（generic_engine_26/）を CI で組む。
#
# ■ なぜ CI で組むか
#   AGENTS.md の決まり「配布物は、必ず CI で作る」。手元で組んだ jar は配らない。
#   加えて 26.1 は Java 25 が要り、手元に無い環境が多い。
#
# ■ 出来た jar の扱い
#   Artifacts に base-mod-neo26.jar が上がる。**public/ への配置は人が確認してから**。
#   置くときは scripts/check-engine-modid.js（npm run check:modid）が通ることを見る。
#   base-mod.jar / base-mod-neo.jar を上書きしないこと（1.20.1 / 1.21.1 の人が遊べなくなる）。
on:
  push:
    branches: [main]
    paths:
      - 'generic_engine_26/**'
      - '.github/workflows/engine-neo26.yml'
  pull_request:
    paths:
      - 'generic_engine_26/**'
      - '.github/workflows/engine-neo26.yml'
  workflow_dispatch:

jobs:
  build-engine:
    name: Build NeoForge 26.1 engine jar
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          # NeoForge 26.1 は Java 25 で組まれている。21 では NeoForge 本体のクラスが読めない
          java-version: '25'

      - name: Build
        working-directory: generic_engine_26
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon --stacktrace --warning-mode all

      - name: modId が焼かれているか
        # 「起動するのに何も動かない」事故の予防。lib/javaEngine/spec.ts の ENGINE_MOD_ID と
        # jar の中の文字列が一致しなければ落とす（scripts/check-engine-modid.js と同じ考え方）
        run: |
          set -e
          JAR=$(ls generic_engine_26/build/libs/*.jar | grep -v -- '-sources' | head -1)
          echo "jar: $JAR"
          MODID=$(grep -o 'ENGINE_MOD_ID *= *"[^"]*"' lib/javaEngine/spec.ts | sed 's/.*"\(.*\)"/\1/')
          echo "spec.ts の ENGINE_MOD_ID: $MODID"
          mkdir -p /tmp/jarcheck && cd /tmp/jarcheck && unzip -oq "$GITHUB_WORKSPACE/$JAR"
          if ! grep -rqa "$MODID" --include='*.class' .; then
            echo "::error::jar の .class に $MODID が入っていない"; exit 1
          fi
          cp "$GITHUB_WORKSPACE/$JAR" /tmp/base-mod-neo26.jar

      - name: Upload engine jar
        uses: actions/upload-artifact@v4
        with:
          name: base-mod-neo26
          path: /tmp/base-mod-neo26.jar
