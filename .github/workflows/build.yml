name: Build Desktop and Mobile Apps

# ⚠️ ブランチ名で検査の有無が変わらないようにすること。
#    以前は push の対象が main と feature/* だけだった。そのため fix/... や chore/... で
#    作業すると**検査が一度も走らないまま main に入れられる**状態だった（2026-09-04 に判明）。
#    せっかく検査を足しても、名前を変えるだけで抜けられては意味がない。
#
#    いまは「main への push」と「Pull request」で走る。PR はブランチ名に関係なく効くので、
#    **main に入る前には必ず1回通る**。feature/* の毎 push で走らせるより実行回数も減る。
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build-mac:
    name: Build Mac (macOS)
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # ⚠️ npm install を使わないこと（3ジョブとも npm ci に統一・2026-09-04）。
      #   ・install は解決結果を package-lock.json に書き戻すため、作業ツリーが汚れる。
      #     配布物ビルド前の「未コミットの変更が無いか」検査がそれで落ちた。
      #   ・そして書き戻るということは、**ロックファイルと違う版が入っていた**ということ。
      #     どの版で作られた配布物なのか言えなくなる。ci なら必ずロックどおりに入る。
      #
      # Node は 22。Capacitor CLI が >=22 を要求するため（20 のままだと Android が
      # 「The Capacitor CLI requires NodeJS >=22.0.0」で必ず落ちる）。release.yml も 22。
      - name: Install Dependencies
        run: npm ci

      - name: Build Mac Apps (Sprout & Grove)
        run: npm run build:all:mac

      # ─── ここから検査。Windows 側(release.yml)と同じ考え方 ────────────
      # 📖 なぜ検査するかは docs/RELEASE.md。
      #    v0.1.0 は「ファイルは落ちてくるのに起動した瞬間に落ちる」状態で公開された。
      #    サイトでは Mac 版も配っているのに、Mac 側は作って置くだけで
      #    一度も確かめていなかった（2026-09-04 に追加）。

      - name: 中身が入っているか（GROVE）
        run: |
          set -e
          APP=$(ls -d dist-exe/grove/mac*/*.app 2>/dev/null | head -1)
          if [ -z "$APP" ]; then echo "::error::.app が出来ていない"; exit 1; fi
          echo "アプリ: $APP"
          # asar: false なので resources/app は素のディレクトリ。
          # .next が丸ごと抜けていても Electron 本体だけで数百MBあり、サイズでは気づけない。
          for f in "Contents/Resources/app/.next/BUILD_ID" \
                   "Contents/Resources/app/electron/main.js" \
                   "Contents/Resources/app/package.json"; do
            if [ ! -e "$APP/$f" ]; then echo "::error::$f が入っていない"; exit 1; fi
          done
          echo "同梱ファイル数: $(find "$APP/Contents/Resources/app" -type f | wc -l)"

      - name: Intel と Apple シリコンの両方が入っているか
        # サイトでは「Intel / Apple シリコン 両対応」と書いて配っている。
        # electron-builder は既定でランナーと同じ CPU 向けにしか作らないため、
        # package.json の build.mac.arch に universal を指定している。それが効いているか見る。
        #
        # ⚠️ 「起動して 200 が返るか」ではこれを捕まえられない。
        #    ランナーは arm64 なので、arm64 専用ビルドでも普通に 200 を返す。
        #    Intel Mac が動かないことは、Intel Mac で動かすまで表に出ない。
        #    だから CPU の中身を直接見る（Mac側シオンの指摘・2026-09-04）。
        #
        # ⚠️ ボリューム名やフォルダ名が "-arm64" でも中身が universal のことがある。
        #    名前で判断しないこと。
        run: |
          set -e
          APP=$(ls -d dist-exe/grove/mac*/*.app | head -1)
          BIN="$APP/Contents/MacOS/$(basename "$APP" .app)"
          FW="$APP/Contents/Frameworks/Electron Framework.framework/Versions/A/Electron Framework"

          for target in "$BIN" "$FW"; do
            if [ ! -e "$target" ]; then echo "::error::$target が無い"; exit 1; fi
            ARCHS=$(lipo -archs "$target")
            echo "$(basename "$target"): $ARCHS"
            # 本体だけ universal でも、Electron 本体が片方だけなら Intel Mac では動かない
            case "$ARCHS" in
              *x86_64*arm64*|*arm64*x86_64*) ;;
              *) echo "::error::$(basename "$target") が両対応ではない（$ARCHS）。Intel Mac で起動できません"; exit 1 ;;
            esac
          done
          echo "Intel / Apple シリコン 両対応 OK"

      - name: 実際に起動して画面が返るか（GROVE）
        # ここが本丸。中身が揃っていても起動するとは限らない。
        #
        # ⚠️ ELECTRON_RUN_AS_NODE を必ず外して起動すること。
        #    これが立っていると Electron は GUI を出さずただの Node として動き、
        #    **終了コード0・出力なし・0秒で即終了**する。クラッシュログも残らないので
        #    「壊れたビルド」にしか見えない。2026-09-01、Mac 側でこれにより
        #    正常な 0.1.5 を不良と誤診し、署名の付け直しまで行った。
        #    ランナーでは通常立っていないが、立っていても壊れないようにしておく。
        run: |
          APP=$(ls -d dist-exe/grove/mac*/*.app | head -1)
          BIN="$APP/Contents/MacOS/$(basename "$APP" .app)"
          env | grep -i electron || echo "(ELECTRON_* の環境変数なし)"
          env -u ELECTRON_RUN_AS_NODE "$BIN" &
          PID=$!
          ok=0
          for i in $(seq 1 36); do
            sleep 5
            if ! kill -0 "$PID" 2>/dev/null; then
              echo "::error::起動直後に落ちた"
              exit 1
            fi
            if curl -fsS --max-time 10 http://127.0.0.1:3200/ > /dev/null 2>&1; then
              ok=1; break
            fi
          done
          kill "$PID" 2>/dev/null || true
          if [ "$ok" -ne 1 ]; then echo "::error::3分待っても 200 を返さなかった"; exit 1; fi
          echo "起動確認 OK（HTTP 200）"

      - name: dmg が出来ているか
        run: |
          ls -la dist-exe/grove/ || true
          DMG=$(ls dist-exe/grove/*.dmg 2>/dev/null | head -1)
          if [ -z "$DMG" ]; then echo "::error::dmg が出力されていない"; exit 1; fi
          SIZE=$(stat -f%z "$DMG")
          echo "dmg: $DMG / $SIZE バイト"
          # 失敗すると数百KBのかけらが残る
          if [ "$SIZE" -lt 100000000 ]; then echo "::error::dmg が小さすぎる。途中で失敗している"; exit 1; fi

      - name: Upload Mac Artifacts (Sprout)
        uses: actions/upload-artifact@v4
        with:
          name: cubicengine-mac-sprout
          path: dist-exe/sprout/*.dmg
          if-no-files-found: ignore

      - name: Upload Mac Artifacts (Grove)
        uses: actions/upload-artifact@v4
        with:
          name: cubicengine-mac-grove
          path: dist-exe/grove/*.dmg
          if-no-files-found: ignore

  build-win:
    name: Build Windows (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci

      - name: Build Windows Apps (Sprout & Grove)
        run: npm run build:all:win

      - name: Upload Windows Artifacts (Sprout)
        uses: actions/upload-artifact@v4
        with:
          name: cubicengine-win-sprout
          path: dist-exe/sprout/*.exe
          if-no-files-found: ignore

      - name: Upload Windows Artifacts (Grove)
        uses: actions/upload-artifact@v4
        with:
          name: cubicengine-win-grove
          path: dist-exe/grove/*.exe
          if-no-files-found: ignore

  build-android:
    name: Build Android APK (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          # Capacitor 8 の capacitor-android は Java 21 でコンパイルされる。
          # 17 のままだと `error: invalid source release: 21` で必ず落ちる。
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Dependencies
        run: npm ci

      - name: Sync Capacitor Android
        run: npm run android:build
        
      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
        
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: cubicengine-android-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
