name: リリース用インストーラのビルド

# 手元の Windows では Application Control ポリシーが signtool.exe の起動をブロックし、
# NSIS の工程が spawn UNKNOWN で落ちる。ランナーにはその制約が無いので、
# インストーラの生成はここで行う。
#
# v0.1.0 は手作業でビルドされ、壊れたまま公開されていた（2026-08-10 に判明）。
#   ・exe が素の electron.exe より 169,984 バイト小さく、起動時に即死（0x80000003）
#   ・Next 16 の cwd 問題で、起動できても全リクエストが 500
# どちらもサイズ検査だけでは気づけない。だから最後に**実際に起動して 200 が返るか**まで見る。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      edition:
        description: 'ビルドする版'
        required: true
        default: 'grove'
        type: choice
        options: [grove, sprout]

permissions:
  contents: write

env:
  # tag push では選べないので既定は grove。統合版(sprout)の .exe はまだ未公開。
  MMC_EDITION: ${{ inputs.edition || 'grove' }}

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 版の名前を決める
        shell: bash
        run: echo "MMC_EDITION_UPPER=$(echo "$MMC_EDITION" | tr '[:lower:]' '[:upper:]')" >> "$GITHUB_ENV"

      - name: 依存をインストール
        run: npm ci

      # これを飛ばすと .next が存在しないまま梱包され、起動しても何も出ない
      - name: 画面をビルド
        run: npm run build

      - name: インストーラをビルド
        run: npx electron-builder --win nsis --x64 --publish never

      # ─── ここから検査。1つでも落ちたら公開しない ───────────────────────

      - name: 実行ファイルが壊れていないか
        # v0.1.0 の実害。electron-builder が exe を書き換える工程で壊れると、
        # 素の electron.exe よりサイズが縮み、起動した瞬間に 0x80000003 で落ちる。
        # アイコンを設定していない今の構成では、両者は完全に同じサイズになるはず。
        shell: pwsh
        run: |
          $built = "dist-exe/$env:MMC_EDITION/win-unpacked/CubicEngine.exe"
          $stock = "node_modules/electron/dist/electron.exe"
          if (-not (Test-Path $built)) { Write-Host "::error::$built が無い"; exit 1 }
          $b = (Get-Item $built).Length
          $s = (Get-Item $stock).Length
          Write-Host "ビルド後: $b / 素のElectron: $s / 差: $($b - $s)"
          if ($b -ne $s) {
            Write-Host "::error::exe のサイズが素の Electron と違う。書き換え工程で壊れた可能性がある（v0.1.0 と同じ症状）"
            exit 1
          }

      - name: 画面が同梱されているか
        # asar: false なので resources/app は素のディレクトリ。
        # .next が丸ごと抜けていても Electron 本体だけで 180MB あるため、
        # サイズ検査では気づけない。
        shell: pwsh
        run: |
          $app = "dist-exe/$env:MMC_EDITION/win-unpacked/resources/app"
          foreach ($f in @("$app/.next/BUILD_ID", "$app/electron/main.js", "$app/package.json")) {
            if (-not (Test-Path $f)) { Write-Host "::error::$f が入っていない"; exit 1 }
          }
          $n = (Get-ChildItem $app -Recurse -File).Count
          Write-Host "同梱ファイル数: $n"
          if ($n -lt 1000) { Write-Host "::error::同梱ファイルが少なすぎる"; exit 1 }

      - name: 実際に起動して画面が返るか
        # ここが本丸。v0.1.0 は「起動はするが全リクエストが 500」だった。
        # 中身の有無を見るだけでは通ってしまうので、実際に叩いて 200 を確かめる。
        shell: pwsh
        run: |
          $exe = "dist-exe/$env:MMC_EDITION/win-unpacked/CubicEngine.exe"
          $p = Start-Process -FilePath $exe -PassThru
          $deadline = (Get-Date).AddMinutes(3)
          $ok = $false
          while ((Get-Date) -lt $deadline) {
            Start-Sleep -Seconds 5
            if (-not (Get-Process -Id $p.Id -ErrorAction SilentlyContinue)) {
              Write-Host "::error::起動直後に落ちた（終了コード $($p.ExitCode)）"
              exit 1
            }
            try {
              $r = Invoke-WebRequest "http://127.0.0.1:3200/" -UseBasicParsing -TimeoutSec 10
              if ($r.StatusCode -eq 200) { $ok = $true; break }
            } catch { }
          }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          if (-not $ok) { Write-Host "::error::3分待っても 200 を返さなかった"; exit 1 }
          Write-Host "起動確認 OK（HTTP 200）"

      - name: インストーラの出力を確認
        shell: pwsh
        run: |
          $dir = "dist-exe/$env:MMC_EDITION"
          Get-ChildItem $dir -File | Format-Table Name, Length
          $exe = Get-ChildItem "$dir/*_editor.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { Write-Host "::error::インストーラが出力されていない"; exit 1 }
          Write-Host "インストーラ: $($exe.Name) / $($exe.Length) バイト"
          # 失敗すると数百KBのスタブが残る
          if ($exe.Length -lt 100000000) { Write-Host "::error::インストーラが小さすぎる。途中で失敗している"; exit 1 }

      - name: アーティファクトとして保存
        uses: actions/upload-artifact@v4
        with:
          name: CUBICENGINE-${{ env.MMC_EDITION }}-installer
          path: dist-exe/${{ env.MMC_EDITION }}/*_editor.exe
          retention-days: 30

      - name: Releases に添付（タグを打った場合のみ）
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "CUBICENGINE ${GITHUB_REF_NAME}" \
            --notes "インストーラは下の ${MMC_EDITION_UPPER}_editor.exe です。

          ⚠️ インストール時に「Windows によって PC が保護されました」と表示される場合があります。「詳細情報」→「実行」を選んでください。コード署名証明書を取得していないための表示です。

          第三者によるウイルススキャン結果はサイトのダウンロードボタン下から確認できます。" \
            dist-exe/${MMC_EDITION}/*_editor.exe
