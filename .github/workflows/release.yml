name: リリース用インストーラのビルド

# 📖 経緯と過去の事故はすべて docs/RELEASE.md に集約している。
#    検査を消す・変える前に必ず読むこと。同じ話をここには書かない（2か所に分かれると片方しか読まれない）。
#
# 要点だけ:
#   ・配布物は手元で作らない。手元の Windows は Application Control ポリシーが
#     signtool.exe をブロックし、NSIS の工程が壊れた exe を黙って吐く。
#   ・v0.1.0 は手作業ビルドで壊れたまま公開された（2026-08-10 判明）。
#   ・サイズ検査だけでは気づけない。だから最後に**実際に起動して 200 が返るか**まで見る。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      edition:
        description: 'ビルドする版'
        required: true
        default: 'grove'
        type: choice
        options: [grove, sprout]

permissions:
  contents: write

env:
  # tag push では選べないので既定は grove。統合版(sprout)の .exe はまだ未公開。
  MMC_EDITION: ${{ inputs.edition || 'grove' }}

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 版の名前を決める
        shell: bash
        run: echo "MMC_EDITION_UPPER=$(echo "$MMC_EDITION" | tr '[:lower:]' '[:upper:]')" >> "$GITHUB_ENV"

      - name: 依存をインストール
        run: npm ci

      # build/ は .gitignore で除外されている（生成物なのでコミットしない方針）。
      # つまりランナーには存在しない。ここで作らないと、アイコン未設定のまま
      # ビルドが通ってしまい、**Electron の既定アイコンとプレースホルダーのタイル画像**で
      # ストアに並ぶことになる。警告は出るがビルドは成功するので気づけない。
      # public/icon-512.png から作るので、アイコンを差し替えれば自動で追従する。
      - name: アイコンとストア用タイル画像を作る
        shell: pwsh
        run: |
          # System.Drawing を使うので Windows PowerShell(5.1) で実行する
          powershell.exe -ExecutionPolicy Bypass -File scripts/make-win-icon.ps1
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::アイコンの生成に失敗"; exit 1 }
          powershell.exe -ExecutionPolicy Bypass -File scripts/make-appx-assets.ps1
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::タイル画像の生成に失敗"; exit 1 }

          # 生成できたか確認する。無いまま進むと既定アイコンで固まる。
          foreach ($f in @(
            "build/icon.ico",
            "build/appx/StoreLogo.png",
            "build/appx/Square44x44Logo.png",
            "build/appx/Square150x150Logo.png",
            "build/appx/Wide310x150Logo.png"
          )) {
            if (-not (Test-Path $f)) { Write-Host "::error::$f が生成されていない"; exit 1 }
          }
          Write-Host "アイコンとタイル画像 OK"

      # 同梱の base-mod*.jar と spec.ts の ENGINE_MOD_ID がズレていないか。
      # ズレると MOD は**起動するのに何も動かない**（エラーもログも出ない）。
      # 遊んでみて「何も起きない」で気づくしかないので、機械で止める。
      # 詳細は scripts/check-engine-modid.js のコメント。
      - name: エンジンの modId が一致しているか
        run: npm run check:modid

      # これを飛ばすと .next が存在しないまま梱包され、起動しても何も出ない
      - name: 画面をビルド
        run: npm run build

      - name: インストーラをビルド
        run: npx electron-builder --win nsis --x64 --publish never

      - name: Microsoft Store 用パッケージをビルド（Java版のみ）
        # package.json の build.appx に入っている ID は Partner Center で
        # **GROVE 用に予約したもの**。統合版(sprout)でこれを使うと、別アプリの
        # 名前を名乗るパッケージができてしまう。だから grove のときだけ作る。
        # 署名はしない（Store 側が署名するため。証明書は不要）。
        if: env.MMC_EDITION == 'grove'
        run: npx electron-builder --win appx --x64 --publish never

      # ─── ここから検査。1つでも落ちたら公開しない ───────────────────────

      - name: 実行ファイルが壊れていないか
        # v0.1.0 の実害。electron-builder が exe を書き換える工程で壊れると、
        # 素の electron.exe よりサイズが縮み、起動した瞬間に 0x80000003 で落ちる。
        #
        # ⚠️ 2026-09-03 に判定を変更。build/icon.ico を追加してアイコンを焼き込むように
        #    したため、**素の electron.exe と同じサイズにはならなくなった**（その分だけ増える）。
        #    以前の「1バイトでも違えばエラー」のままだと、正常なビルドが必ず落ちる。
        #    見るべきは「増えたか減ったか」。**縮んでいたら壊れている**（v0.1.0 は -169,984 バイト）。
        shell: pwsh
        run: |
          $built = "dist-exe/$env:MMC_EDITION/win-unpacked/CubicEngine.exe"
          $stock = "node_modules/electron/dist/electron.exe"
          if (-not (Test-Path $built)) { Write-Host "::error::$built が無い"; exit 1 }
          $b = (Get-Item $built).Length
          $s = (Get-Item $stock).Length
          $diff = $b - $s
          Write-Host "ビルド後: $b / 素のElectron: $s / 差: $diff"
          if ($diff -lt 0) {
            Write-Host "::error::exe が素の Electron より小さい。書き換え工程で壊れている（v0.1.0 と同じ症状）"
            exit 1
          }
          # アイコンを足しただけで数MBも増えることはない。増えすぎも異常とみなす。
          if ($diff -gt 5000000) {
            Write-Host "::error::exe が想定より大きい（差 $diff バイト）。書き換え工程を確認すること"
            exit 1
          }

      - name: 画面が同梱されているか
        # asar: false なので resources/app は素のディレクトリ。
        # 画面が丸ごと抜けていても Electron 本体だけで 180MB あるため、
        # サイズ検査では気づけない。
        #
        # ⚠️ 2026-09-04、見る場所を out/ に変更。サーバー方式をやめ、静的な out/ を
        #    app:// で直接読むようにしたため、.next ではなく out/ が本体になった。
        shell: pwsh
        run: |
          $app = "dist-exe/$env:MMC_EDITION/win-unpacked/resources/app"
          foreach ($f in @("$app/out/index.html", "$app/out/editor/index.html", "$app/electron/main.js", "$app/package.json")) {
            if (-not (Test-Path $f)) { Write-Host "::error::$f が入っていない"; exit 1 }
          }
          $n = (Get-ChildItem $app -Recurse -File).Count
          Write-Host "同梱ファイル数: $n"
          if ($n -lt 1000) { Write-Host "::error::同梱ファイルが少なすぎる"; exit 1 }

      - name: 実際に起動して画面が出るか
        # ここが本丸。v0.1.0 は「起動はするが全リクエストが 500」だった。
        # 中身の有無を見るだけでは通ってしまうので、**実際に画面を出せたか**を確かめる。
        #
        # ⚠️ 2026-09-04、判定方法を変更。
        #    以前は 127.0.0.1:3200 に HTTP で問い合わせていたが、アプリが中で
        #    サーバーを立てるのをやめた（out/ を app:// で直接読む方式にした）ため、
        #    ポートは開かなくなった。**開かないのが正常**になった。
        #    代わりに、画面を読み込めたときだけアプリが書く boot-state.json を見る。
        #      pending:true  … 起動途中で終わった（＝失敗）
        #      pending:false … 画面まで到達した（＝成功。markBootOk が呼ばれた）
        #
        # ⚠️ ELECTRON_RUN_AS_NODE を必ず外すこと。立っていると Electron は GUI を
        #    出さずただの Node として動き、出力も残さず即終了する。「壊れたビルド」に
        #    しか見えない。Mac 側が 2026-09-01 にこれで正常なビルドを不良と誤診し、
        #    Windows 側も 2026-09-04 に同じ罠で測定を無駄にした。
        shell: pwsh
        run: |
          $exe = "dist-exe/$env:MMC_EDITION/win-unpacked/CubicEngine.exe"
          $state = "$env:APPDATA\minemodcraft\boot-state.json"
          Remove-Item $state -Force -ErrorAction SilentlyContinue
          Get-ChildItem env: | Where-Object { $_.Name -like "ELECTRON*" } | ForEach-Object { "環境変数: $($_.Name)=$($_.Value)" }

          $si = New-Object System.Diagnostics.ProcessStartInfo
          $si.FileName = (Resolve-Path $exe)
          $si.UseShellExecute = $false
          $si.EnvironmentVariables.Remove("ELECTRON_RUN_AS_NODE") | Out-Null
          $p = [System.Diagnostics.Process]::Start($si)

          $deadline = (Get-Date).AddMinutes(3)
          $ok = $false
          while ((Get-Date) -lt $deadline) {
            Start-Sleep -Seconds 5
            if ($p.HasExited) { Write-Host "::error::起動直後に落ちた（終了コード $($p.ExitCode)）"; exit 1 }
            if (Test-Path $state) {
              $s = Get-Content $state -Raw
              if ($s -match '"pending"\s*:\s*false') { $ok = $true; break }
            }
          }
          if (-not $p.HasExited) { $p.Kill() }
          if (-not $ok) {
            Write-Host "::error::3分待っても画面を出せなかった（boot-state が pending:false にならない）"
            if (Test-Path $state) { Write-Host "  boot-state: $(Get-Content $state -Raw)" }
            exit 1
          }
          Write-Host "起動確認 OK（画面の読み込みに成功）"

      - name: インストーラの出力を確認
        shell: pwsh
        run: |
          $dir = "dist-exe/$env:MMC_EDITION"
          Get-ChildItem $dir -File | Format-Table Name, Length
          $exe = Get-ChildItem "$dir/*_editor.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { Write-Host "::error::インストーラが出力されていない"; exit 1 }
          Write-Host "インストーラ: $($exe.Name) / $($exe.Length) バイト"
          # 失敗すると数百KBのスタブが残る
          if ($exe.Length -lt 100000000) { Write-Host "::error::インストーラが小さすぎる。途中で失敗している"; exit 1 }

      - name: Store 用パッケージを検査（Java版のみ）
        # Partner Center は中身が違っていても「形式が正しければ」受け取ってしまう。
        # 弾かれるのは審査に回ってから＝数日無駄になる。だからここで中身を見る。
        if: env.MMC_EDITION == 'grove'
        shell: pwsh
        run: |
          $appx = Get-ChildItem "dist-exe/$env:MMC_EDITION/*_editor.appx" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $appx) { Write-Host "::error::.appx が出力されていない"; exit 1 }
          Write-Host "パッケージ: $($appx.Name) / $($appx.Length) バイト"
          if ($appx.Length -lt 100000000) { Write-Host "::error::.appx が小さすぎる。途中で失敗している"; exit 1 }

          # .appx は zip。中の AppxManifest.xml を取り出して中身を確かめる。
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead($appx.FullName)
          try {
            $entry = $zip.Entries | Where-Object { $_.FullName -eq 'AppxManifest.xml' }
            if (-not $entry) { Write-Host "::error::AppxManifest.xml が入っていない"; exit 1 }
            $reader = New-Object System.IO.StreamReader($entry.Open())
            $xml = $reader.ReadToEnd()
            $reader.Close()
          } finally { $zip.Dispose() }

          $required = @{
            # ここが抜けると Windows が %APPDATA% への書き込みを別の場所へ横流しする。
            # jar は保存できたように見えるのに Minecraft からは見えない＝一番怖い壊れ方。
            # しかもエラーが出ないので、動かしても気づけないことがある。
            'FileSystemWriteVirtualization>disabled' = 'MODの書き込み先が横流しされない設定'
            'RegistryWriteVirtualization>disabled'   = 'レジストリ書き込みの横流し防止'
            # ⚠️ 上の設定は、この許可の宣言が無いと**インストール自体ができない**。
            #    makeappx は通ってしまうので、入れてみるまで気づけない（0x80073CF0）。
            #    2026-09-03、設定だけ入れて許可を忘れ、この検査も素通りさせた。
            'Name="unvirtualizedResources"'         = '仮想化オフを使うための許可'
            # Partner Center に登録した ID と1文字でも違うとアップロードが弾かれる。
            'Name="CUBICENGINEstudio.CUBICENGINEGROVE"' = 'Partner Center の Identity Name'
            'CN=87788BE5-5897-4593-8CAD-DA1FF10A252C'   = 'Partner Center の Publisher'
          }
          $failed = $false
          foreach ($k in $required.Keys) {
            if ($xml -match [regex]::Escape($k)) {
              Write-Host "OK  $($required[$k])"
            } else {
              Write-Host "::error::マニフェストに $k が無い（$($required[$k])）"
              $failed = $true
            }
          }
          if ($failed) { exit 1 }

          # 手元検証用のビルド（MMC_APPX_TEST=1）が紛れ込んでいないか。
          # あれは Publisher に「署名なしで入れてよい」印を足したもので、
          # Partner Center の Publisher と一致しないため提出しても弾かれる。
          # 見た目もファイル名も本番と区別がつかないので、ここで止める。
          if ($xml -match 'OID\.2\.25\.311729368913984317654407730594956997722') {
            Write-Host "::error::手元検証用(MMC_APPX_TEST=1)のパッケージです。提出できません"
            exit 1
          }

          # MaxVersionTested が MinVersion より古いと makeappx は通っても
          # Partner Center 側で弾かれる。数値で比較する。
          $min = [version]([regex]::Match($xml, 'MinVersion="([^"]+)"').Groups[1].Value)
          $max = [version]([regex]::Match($xml, 'MaxVersionTested="([^"]+)"').Groups[1].Value)
          Write-Host "MinVersion: $min / MaxVersionTested: $max"
          if ($max -lt $min) {
            Write-Host "::error::MaxVersionTested($max) が MinVersion($min) より古い"
            exit 1
          }

      - name: Store 用パッケージを実際にインストールして動かす（Java版のみ）
        # ここが .appx の本丸。マニフェストに文字が入っているかを見るだけでは、
        # 「入れられるか」も「箱の外に書けるか」も分からない。
        #
        # 2026-09-03 に踏んだ実例:
        #   ・仮想化オフの設定は入っていたが、それを使う許可の宣言を忘れていた
        #     → makeappx は通り、文字列検査も通り、**インストールで初めて弾かれた**
        #   ・手元で試そうとしたが、実行ファイルを含む MSIX は署名なしでは入れられず、
        #     手元の signtool は .appx 署名に対応していなかった（A required function is not present）
        # ランナーには Windows SDK が入っていて管理者権限もあるので、ここでなら試せる。
        #
        # 提出する .appx には触らない。**複製に署名して**入れ、最後に消す。
        if: env.MMC_EDITION == 'grove'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $src = Get-ChildItem "dist-exe/$env:MMC_EDITION/*_editor.appx" | Select-Object -First 1
          $publisher = 'CN=87788BE5-5897-4593-8CAD-DA1FF10A252C'
          $pkgName   = 'CUBICENGINEstudio.CUBICENGINEGROVE'
          $appId     = 'CUBICENGINEGROVE'
          $work      = Join-Path $env:RUNNER_TEMP 'appx-verify'
          New-Item -ItemType Directory -Force $work | Out-Null
          $signed = Join-Path $work 'signed.appx'
          Copy-Item $src.FullName $signed

          # 署名。Subject はパッケージの Publisher と1文字も違ってはいけない。
          $cert = New-SelfSignedCertificate -Type Custom -Subject $publisher `
            -KeyUsage DigitalSignature -CertStoreLocation 'Cert:\CurrentUser\My' `
            -TextExtension @('2.5.29.37={text}1.3.6.1.5.5.7.3.3','2.5.29.19={text}Subject Type:End Entity')
          $pfx = Join-Path $work 't.pfx'
          $pw  = ConvertTo-SecureString -String 'ci-throwaway' -Force -AsPlainText
          Export-PfxCertificate -Cert $cert -FilePath $pfx -Password $pw | Out-Null
          $cer = Join-Path $work 't.cer'
          Export-Certificate -Cert $cert -FilePath $cer | Out-Null
          Import-Certificate -FilePath $cer -CertStoreLocation 'Cert:\LocalMachine\TrustedPeople' | Out-Null

          $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe' |
                      Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { Write-Host "::error::signtool が見つからない"; exit 1 }
          & $signtool.FullName sign /fd SHA256 /f $pfx /p 'ci-throwaway' $signed
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::署名に失敗（$LASTEXITCODE）"; exit 1 }

          # インストール。ここで落ちた場合、ランナー側の制約か、パッケージの不備かを
          # 切り分けられないので、メッセージをそのまま出す。
          try {
            Add-AppxPackage -Path $signed -ErrorAction Stop
          } catch {
            Write-Host "::error::インストールできない: $($_.Exception.Message)"
            exit 1
          }
          $pkg = Get-AppxPackage -Name $pkgName
          Write-Host "インストール OK: $($pkg.PackageFullName)"

          # 箱の中のアプリとして起動する（exe を直接叩くと箱の外で動いてしまう）
          # ⚠️ 判定は boot-state.json（pending:false = 画面を出せた）。
          #    サーバーを立てない方式にしたので 3200 は開かない。詳細は上の起動検査のコメント。
          $state = "$env:APPDATA\minemodcraft\boot-state.json"
          Remove-Item $state -Force -ErrorAction SilentlyContinue
          Start-Process "shell:appsFolder\$($pkg.PackageFamilyName)!$appId"
          $ok = $false
          $deadline = (Get-Date).AddMinutes(3)
          while ((Get-Date) -lt $deadline) {
            Start-Sleep -Seconds 5
            try {
              if ((Test-Path $state) -and ((Get-Content $state -Raw) -match '"pending"\s*:\s*false')) { $ok = $true; break }
            } catch { }
          }
          if (-not $ok) { Write-Host "::error::MSIX版が3分待っても画面を出せなかった"; exit 1 }
          Write-Host "起動 OK（画面の読み込みに成功）"

          # 一番大事な確認。アプリは起動時に userData へ boot-state.json を書く。
          # それが本物の %APPDATA% に出れば仮想化オフが効いている。
          # 箱の中(LocalCache)に出るなら、MOD は Minecraft に永遠に届かない。
          #
          # ⚠️ フォルダ名を決め打ちしないこと。userData は Electron の app.getName() で
          #    決まり、同梱の package.json に productName が無いので name（minemodcraft）が
          #    使われる。2026-09-03、CubicEngine 決め打ちで探して「どこにも無い」と
          #    誤判定した。名前が変わっても壊れないよう、探して見つける。
          $realRoot  = $env:APPDATA
          $boxRoot   = Join-Path $env:LOCALAPPDATA "Packages\$($pkg.PackageFamilyName)\LocalCache\Roaming"
          $realHit = Get-ChildItem $realRoot -Recurse -Depth 2 -Filter 'boot-state.json' -ErrorAction SilentlyContinue | Select-Object -First 1
          $boxHit  = if (Test-Path $boxRoot) {
            Get-ChildItem $boxRoot -Recurse -Depth 2 -Filter 'boot-state.json' -ErrorAction SilentlyContinue | Select-Object -First 1
          } else { $null }
          Write-Host "本物の %APPDATA% : $(if ($realHit) { $realHit.FullName } else { '見つからず' })"
          Write-Host "箱の中           : $(if ($boxHit)  { $boxHit.FullName }  else { '見つからず' })"

          # 判定に使う。以降の Test-Path が使えるよう、見つかった場所を変数に入れる。
          $real       = if ($realHit) { $realHit.FullName } else { Join-Path $realRoot '__not_found__' }
          $redirected = if ($boxHit)  { $boxHit.FullName }  else { Join-Path $boxRoot  '__not_found__' }

          Get-Process -Name 'CubicEngine' -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Get-AppxPackage -Name $pkgName | Remove-AppxPackage
          Remove-Item "Cert:\LocalMachine\TrustedPeople\$($cert.Thumbprint)" -Force -ErrorAction SilentlyContinue
          Remove-Item "Cert:\CurrentUser\My\$($cert.Thumbprint)" -Force -ErrorAction SilentlyContinue

          if (Test-Path $redirected) {
            Write-Host "::error::書き込みが箱の中へ横流しされた。この .appx では MOD が Minecraft に届かない"
            exit 1
          }
          if (-not (Test-Path $real)) {
            Write-Host "::error::本物の %APPDATA% にも書かれていない。判定できないので通さない"
            exit 1
          }
          Write-Host "書き込み先 OK（本物の %APPDATA% に出た）"

      - name: アーティファクトとして保存
        uses: actions/upload-artifact@v4
        with:
          name: CUBICENGINE-${{ env.MMC_EDITION }}-installer
          path: dist-exe/${{ env.MMC_EDITION }}/*_editor.exe
          retention-days: 30

      - name: Store 用パッケージを保存（Java版のみ）
        # Releases には添付しない。Partner Center へ手で上げるものなので、
        # 一般の人が間違って .appx を掴んでしまうと（署名が無いため）入れられない。
        if: env.MMC_EDITION == 'grove'
        uses: actions/upload-artifact@v4
        with:
          name: CUBICENGINE-${{ env.MMC_EDITION }}-store-package
          path: dist-exe/${{ env.MMC_EDITION }}/*_editor.appx
          retention-days: 30

      - name: Releases に添付（タグを打った場合のみ）
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
